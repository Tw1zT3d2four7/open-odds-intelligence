services:
  open-odds-intelligence-admin-staging:
    image: ghcr.io/tw1zT3d2four7/open-odds-intelligence:dev
    pull_policy: always
    container_name: open-odds-intelligence-admin-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    ports:
      - "127.0.0.1:18765:8765"
    volumes:
      - ./staging-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
