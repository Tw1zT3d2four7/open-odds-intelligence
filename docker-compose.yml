services:
  open-odds-intelligence:
    image: ghcr.io/tw1zt3d2four7/open-odds-intelligence:latest
    pull_policy: always
    container_name: open-odds-intelligence
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8765:8765"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
