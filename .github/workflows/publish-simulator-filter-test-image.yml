name: Publish simulator and performance test image

on:
  push:
    branches:
      - fix/simulator-market-mode-readiness
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements*.txt"
      - "app/**"
      - "scripts/**"
      - "web/**"
      - "tests/**"
      - ".github/workflows/publish-simulator-filter-test-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: simulator-filter-test-image
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application before image build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile application and tests
        run: python -m compileall -q app tests
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline dashboard JavaScript found")
          Path("/tmp/open-odds-dashboard.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/open-odds-dashboard.js
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Run test suite
        run: python -m pytest -q

  publish:
    name: Build and publish isolated test image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/tw1zt3d2four7/open-odds-intelligence:simulator-filter-test
            ghcr.io/tw1zt3d2four7/open-odds-intelligence:simulator-filter-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Open Odds Intelligence
            org.opencontainers.image.description=Simulator, filter and dashboard performance test build
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Tw1zT3d2four7/open-odds-intelligence
