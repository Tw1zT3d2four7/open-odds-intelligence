name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline dashboard JavaScript found")
          Path("/tmp/open-odds-dashboard.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/open-odds-dashboard.js
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env
      - run: python -m pytest -q
