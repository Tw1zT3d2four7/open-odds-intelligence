name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app tests scripts
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for page in ("index", "admin", "auth", "account"):
              html = Path(f"web/{page}.html").read_text(encoding="utf-8")
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S)
              if not scripts:
                  raise SystemExit(f"No inline JavaScript found in web/{page}.html")
              Path(f"/tmp/open-odds-{page}.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          for page in index admin auth account; do
            node --check "/tmp/open-odds-$page.js"
          done
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Validate environment template keys
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          keys = []
          for raw in Path(".env.example").read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              keys.append(line.split("=", 1)[0].strip())
          duplicates = sorted(key for key, count in Counter(keys).items() if count > 1)
          if duplicates:
              raise SystemExit("Duplicate .env.example keys: " + ", ".join(duplicates))
          PY
      - name: Validate Docker build context exclusions
        run: |
          grep -Fxq '.env' .dockerignore
          grep -Fxq 'data/' .dockerignore
          grep -Fxq '*.sqlite3' .dockerignore
          rm .env
      - name: Validate simulator CLIs
        run: |
          python -m scripts.backtest_simulator --help
          python -m scripts.import_simulation_results --help
          python -m scripts.sync_nflverse_results --help | grep -F -- '--build-model'
          grep -Fxq 'COPY scripts ./scripts' Dockerfile
      - run: python -m pytest -q
