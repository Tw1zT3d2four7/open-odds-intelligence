name: Build and publish release image

on:
  push:
    branches: [main, recovery/pre-admin-performance, development, feature/admin-panel-and-subscriptions]
  release:
    types: [published]
  workflow_dispatch:

# Keep image tags isolated: main publishes :latest, development publishes :dev,
# and the admin feature branch publishes :admin-staging. Only a GitHub release
# event may publish the :release alias.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not cancel a verified image build on every subsequent push. Newer commits
  # wait as the single pending run, so the release tag is actually published.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile application and tests
        run: python -m compileall -q app tests
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for page in ("web/index.html", "web/admin.html", "web/auth.html", "web/account.html"):
              html = Path(page).read_text(encoding="utf-8")
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S)
              if not scripts:
                  raise SystemExit(f"No inline JavaScript found in {page}")
              output = Path("/tmp") / (Path(page).stem + ".js")
              output.write_text("\n".join(scripts), encoding="utf-8")
              print(f"Checking {page}")
              import subprocess
              subprocess.run(["node", "--check", str(output)], check=True)
          PY
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Validate Docker build context exclusions
        run: |
          grep -Fxq '.env' .dockerignore
          grep -Fxq 'data/' .dockerignore
          grep -Fxq '*.sqlite3' .dockerignore
          rm .env
      - name: Run test suite
        run: python -m pytest -q

  publish:
    name: Build and publish container image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Normalize image name
        run: echo "IMAGE_NAME_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/development' }}
            type=raw,value=admin-staging,enable=${{ github.ref == 'refs/heads/feature/admin-panel-and-subscriptions' }}
            type=raw,value=release,enable=${{ github.event_name == 'release' }}
            type=raw,value=recovery-test,enable=${{ github.ref == 'refs/heads/recovery/pre-admin-performance' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

# Trigger a verified default-branch image publication.
