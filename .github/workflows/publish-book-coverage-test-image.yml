name: Publish sportsbook coverage test image

on:
  push:
    branches:
      - fix/remove-sportsgameodds-expand-book-coverage
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "app/**"
      - "scripts/**"
      - "web/**"
      - ".github/workflows/publish-book-coverage-test-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: book-coverage-test-ghcr-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish sportsbook coverage test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tw1zt3d2four7/open-odds-intelligence:book-coverage-test
            ghcr.io/tw1zt3d2four7/open-odds-intelligence:book-coverage-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Open Odds Intelligence
            org.opencontainers.image.description=Sportsbook coverage test image without SportsGameOdds
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Tw1zT3d2four7/open-odds-intelligence
